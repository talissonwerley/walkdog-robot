name: Robot Framework CI

on:
  push:
    branches: [testes]
  pull_request:
    branches: [testes]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Chrome and Chromedriver (matching versions)
        run: |
          # Instala Chrome estável mais recente
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

          # Obtém a versão exata do Chrome instalado
          CHROME_VERSION=$(google-chrome-stable --version | awk '{print $3}')
          echo "Chrome version: $CHROME_VERSION"

          # Baixa o Chromedriver correspondente
          CHROMEDRIVER_VERSION=$(curl -s https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_VERSION%.*})
          echo "Chromedriver version: $CHROMEDRIVER_VERSION"

          wget -q https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip
          unzip -q chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver

          # Verifica as versões
          google-chrome-stable --version
          chromedriver --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install robotframework robotframework-seleniumlibrary==6.1.0

      - name: Verify test data
        run: |
          mkdir -p test_data
          ls -la test_data/

      - name: Run Robot Framework Tests
        run: |
          robot --variable DOCUMENTO:${GITHUB_WORKSPACE}/test_data/document.png tests/
