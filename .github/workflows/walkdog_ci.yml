name: Robot Framework CI

on:
  push:
    branches: [testes]
  pull_request:
    branches: [testes]

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install specific Chrome version
        run: |
          # Versões específicas e compatíveis (Chrome 114 e ChromeDriver 114.0.5735.90)
          CHROME_VERSION="114.0.5735.90-1"
          CHROMEDRIVER_VERSION="114.0.5735.90"

          # Instala o Chrome específico
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable=$CHROME_VERSION
          sudo apt-mark hold google-chrome-stable

          # Baixa e instala o ChromeDriver específico
          wget -q https://chromedriver.storage.googleapis.com/$CHROMEDRIVER_VERSION/chromedriver_linux64.zip
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver

          # Verifica as versões instaladas
          echo "Chrome version: $(google-chrome-stable --version)"
          echo "ChromeDriver version: $(chromedriver --version)"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install robotframework robotframework-seleniumlibrary==6.1.0

      - name: Prepare test data folder
        run: |
          mkdir -p test_data
          echo "placeholder" > test_data/document.png

      - name: Run Robot Framework tests
        run: |
          robot --variable DOCUMENTO:${GITHUB_WORKSPACE}/test_data/document.png tests/
