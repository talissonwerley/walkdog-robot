name: Robot Framework CI

on:
  push:
    branches: [testes]
  pull_request:
    branches: [testes]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Instala Node.js e dependências (se necessário para o seu projeto)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (npm)
        run: npm ci
        working-directory: ./walkdog-robot # ajuste se estiver na raiz

      # Garante que Python e pip estão disponíveis
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies (Robot Framework)
        run: |
          python -m pip install --upgrade pip
          pip install robotframework robotframework-seleniumlibrary
        working-directory: ./walkdog-robot # ajuste conforme sua estrutura

      # Executa os testes Robot
      - name: Run Robot Framework Tests
        run: robot tests/
        working-directory: ./walkdog-robot # ajuste conforme necessário
