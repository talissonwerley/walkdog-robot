name: Robot Framework CI

on:
  push:
    branches: [testes]
  pull_request:
    branches: [testes]

jobs:
  test:
    runs-on: ubuntu-22.04 # Versão mais estável, evita Chrome 138

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Chrome 116 and Chromedriver 116
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl

          # Remove qualquer chrome pré-instalado
          sudo apt remove -y google-chrome-stable || true

          # Instala o Chrome 116
          wget https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_116.0.5845.96-1_amd64.deb
          sudo dpkg -i google-chrome-stable_116.0.5845.96-1_amd64.deb || sudo apt-get -f install -y

          # Instala o Chromedriver 116
          wget https://chromedriver.storage.googleapis.com/116.0.5845.96/chromedriver_linux64.zip
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver

          # Verificações
          google-chrome --version
          chromedriver --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install robotframework robotframework-seleniumlibrary==6.1.0

      - name: Prepare test data folder
        run: |
          mkdir -p test_data
          # Exemplo: coloca uma imagem se necessário
          echo "placeholder" > test_data/document.png

      - name: Run Robot Framework tests
        run: |
          robot --variable DOCUMENTO:${GITHUB_WORKSPACE}/test_data/document.png tests/
