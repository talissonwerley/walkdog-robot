name: Robot Framework CI

on:
  push:
    branches: [testes]
  pull_request:
    branches: [testes]

jobs:
  test:
    runs-on: ubuntu-22.04 # Versão mais estável, evita Chrome 138

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Baixar e instalar ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome --version | grep -o '[0-9.]\+')
          LATEST_CHROMEDRIVER=$(curl -s https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_VERSION%%.*})
          wget -q https://chromedriver.storage.googleapis.com/$LATEST_CHROMEDRIVER/chromedriver_linux64.zip
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          echo "/usr/local/bin" >> $GITHUB_PATH

          # Verificações
          google-chrome --version
          chromedriver --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install robotframework robotframework-seleniumlibrary==6.1.0

      - name: Prepare test data folder
        run: |
          mkdir -p test_data
          # Exemplo: coloca uma imagem se necessário
          echo "placeholder" > test_data/document.png

      - name: Run Robot Framework tests
        run: |
          robot --variable DOCUMENTO:${GITHUB_WORKSPACE}/test_data/document.png tests/
