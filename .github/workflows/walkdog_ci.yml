name: Robot Framework CI

on:
  push:
    branches: [testes]
  pull_request:
    branches: [testes]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Garante que Python e pip estão disponíveis
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies (Robot Framework)
        run: |
          python -m pip install --upgrade pip
          pip install robotframework robotframework-seleniumlibrary

      # Executa os testes Robot
      - name: Run Robot Framework Tests
        run: robot tests/
